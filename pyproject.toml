[project]
name = "dockermin"
version = "0.0.1"
description = "GRPO-fine-tuned Qwen 2.5 Coder 7B that rewrites Dockerfiles to be smaller while staying functional."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Vlad Temian", email = "vladtemian@gmail.com" }]

dependencies = [
  # prime-rl pulls verifiers, vllm, transformers, peft transitively.
  # Pinning prime-rl explicitly + leaving verifiers floating to whatever prime-rl needs.
  "prime-rl",                # exact commit pin set during Task 1.3 once we confirm PR #1392 status
  "verifiers>=0.1.5",        # 0.1.4 lacks LoRA hotswap glue; prime-rl needs newer
  "vllm==0.7.3",
  "transformers==4.46.*",
  "peft==0.13.*",
  "torch==2.5.*",
  "accelerate==1.1.*",
  "datasets==3.1.*",
  "dockerfile==3.3.1",       # deprecated upstream but works
  "docker==7.1.*",
  "huggingface_hub",
  "wandb",
  "anthropic",               # synthetic variant generation + Sonnet baseline
  "openai",                  # GPT-4o baseline
  "tqdm",
  "tenacity",                # retry on Docker daemon flakes
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "ipython",
]

[project.scripts]
dockermin = "dockermin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
exclude = [".git", ".ruff_cache", ".venv", "data", "logs"]

[tool.ruff.lint]
select = [
    "F",        # pyflakes
    "E", "W",   # pycodestyle
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit
    "T20",      # flake8-print
    "N",        # pep8-naming
    "ANN",      # flake8-annotations
    "A",        # flake8-builtins
    "ARG",      # flake8-unused-arguments
    "ERA",      # eradicate (commented-out code)
    "PLR",      # pylint refactor
    "PLW",      # pylint warnings
    "PLE",      # pylint errors
    "PERF",     # perflint
    "RUF",      # ruff-specific
    "TRY",      # tryceratops
    "BLE",      # flake8-blind-except
    "EM",       # flake8-errmsg
    "C90",      # mccabe complexity
    "RET",      # flake8-return
    "TCH",      # flake8-type-checking
    "PIE",      # flake8-pie
]
ignore = [
    "S101",     # assert in tests
    "S311",     # pseudo-random (non-crypto: hash suffixes, seeds)
    "SIM105",   # contextlib.suppress over try/except/pass — readability choice
    "ANN204",   # missing return type for __init__
    "TRY003",   # long exception messages are fine
    "RET504",   # unnecessary assignment before return — readability choice
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# We target Python 3.11 (pinned by the torch/vllm ML stack - cannot move to
# 3.14 where PEP 649 would make this unnecessary). With the TCH rule deferring
# type-only imports under `if TYPE_CHECKING:`, the future import is what keeps
# those annotations from NameError-ing at runtime. Enforce it everywhere so it
# is a deliberate one-line policy, not scattered cargo-cult.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 4
max-returns = 4
max-statements = 15

[tool.ruff.lint.per-file-ignores]
# Tests: relax annotations, unused args, magic values, long functions, asserts
"tests/*.py" = ["ANN", "ARG", "PLR2004", "PLR0915", "S101", "S105", "S106"]
# Operational scripts are CLI entrypoints: print is the UI, they shell out to
# docker/gh/claude, and they orchestrate (longer functions, more branches).
"scripts/*.py" = ["T20", "S603", "S607", "ANN", "PLR0912", "PLR0913", "PLR0915", "C901", "BLE001"]
# CLI module: prints results to stdout by design, lazy heavy imports inside main
"src/dockermin/cli.py" = ["T201", "PLC0415"]
# prime-rl environment package: thin adapter
"prime_env/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
exclude = ["data/", "logs/", "\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "dockerfile.*",
    "docker.*",
    "vllm.*",
    "verifiers.*",
    "peft.*",
    "transformers.*",
    "datasets.*",
    "huggingface_hub.*",
    "wandb.*",
    "anthropic.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/dockermin"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
