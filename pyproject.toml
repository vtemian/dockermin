[project]
name = "dockermin"
version = "0.0.1"
description = "GRPO-fine-tuned Qwen 2.5 Coder 7B that rewrites Dockerfiles to be smaller while staying functional."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Vlad Temian", email = "vladtemian@gmail.com" }]

# Pinned per plan section 1. Versions chosen for verifiers + prime-rl + vllm LoRA hotswap compatibility on Prime Intellect Lab (May 2026).
dependencies = [
  "verifiers==0.1.4",
  "vllm==0.7.3",
  "transformers==4.46.*",
  "peft==0.13.*",
  "trl==0.12.*",
  "torch==2.5.*",
  "accelerate==1.1.*",
  "datasets==3.1.*",
  "dockerfile==3.3.1",
  "docker==7.1.*",
  "huggingface_hub",
  "wandb",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "ipython",
]

[project.scripts]
dockermin = "dockermin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
