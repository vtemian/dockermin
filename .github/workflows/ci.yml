name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest dockerfile docker tqdm tenacity huggingface_hub anthropic openai datasets
          pip install --no-deps -e .

      - name: Run pytest (skip docker-gated by marker)
        run: pytest tests/ -v --tb=short -m "not docker"

      - name: Ruff lint (advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --no-fix src tests scripts
