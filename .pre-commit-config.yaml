default_stages: [pre-commit]
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Local mypy hook runs in the project venv so it sees installed deps
  # (pytest, tenacity, the ML libs). mirrors-mypy uses an isolated env that
  # can't resolve them, producing false import-not-found errors. This matches
  # how CI runs mypy (real install, then `mypy src tests`).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project venv)
        entry: .venv/bin/mypy
        language: system
        args: [--config-file=pyproject.toml, src, tests]
        pass_filenames: false
        types: [python]
