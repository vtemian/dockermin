# configs/dockermin_full.toml — 200-step GRPO full run
#
# Same schema and launch notes as dockermin_pilot.toml (see its header +
# docs/decisions/2026-05-22-prime-rl-pin.md). Promote to this only after the
# pilot clears its go/no-go gate. Validate with:
#
#   uv run --no-sync rl @ configs/dockermin_full.toml --dry-run
#
# On 8xH100 this uses the DEFAULT split deployment (inference on some GPUs,
# trainer on others via `rl` with --inference-gpu-ids / --trainer-gpu-ids) — no
# single-GPU colocation hacks — but STILL needs VLLM_USE_DEEP_GEMM=0 and a capped
# --inference.model.max-model-len for Qwen 7B.

max_steps = 200
seq_len = 4096

[ckpt]

[model]
name = "Qwen/Qwen2.5-Coder-7B-Instruct"

[wandb]
project = "dockermin"
name = "full-200step"

[trainer.model]
impl = "auto"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
lr = 5e-6

[trainer.weight_broadcast]
type = "filesystem"

[orchestrator]
batch_size = 32
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.env]]
id = "dockermin-env"
name = "dockermin-env"
args = {}

[inference] # defaults; max-model-len capped at launch (see pilot header)
