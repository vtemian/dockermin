# configs/dockermin_full.toml
# Schema verified against prime-rl examples/alphabet_sort/rl.toml on
# 2026-05-22. See pilot.toml for schema notes.
max_steps = 200
batch_size = 32
rollouts_per_example = 8
learning_rate = 5e-6
oversampling_factor = 1.5
max_async_level = 2
trajectory_strategy = "interleaved"

[sampling]
max_tokens = 1024
temperature = 1.0

[[env]]
id = "dockermin-env"

[model]
name = "Qwen/Qwen2.5-Coder-7B-Instruct"

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.weight_broadcast]
type = "filesystem"

[wandb]
project = "dockermin"
name = "full-200step"
entity = "vladtemian"

[checkpoints]
interval = 25
keep_cloud = 2

[infrastructure]
compute_size = "L"
