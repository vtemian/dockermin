# configs/dockermin_v4.toml — GRPO v4 (Gemma 4 12B-it base swap)
#
# Plan: docs/plans/2026-06-09-v4-gemma-grpo.md
# Probe result: docs/decisions/2026-06-08-gemma-zs-probe-result.md (81.1% pass, 38.2% reduction)
# Decision rule: this arc succeeds iff pass-rate >= 81.1 AND reduction|pass >= 50%.
#
# Validate with:
#   uv run --no-sync rl @ configs/dockermin_v4.toml --dry-run
#
# Key deltas vs configs/dockermin_v3.toml (Qwen 7B):
#   - [model] name = "google/gemma-4-12B-it"  (NEW)
#   - [trainer.model.lora] target_modules pinned to the 7-projection standard set
#       (Gemma 4 Unified has vision/audio projections we must skip; default
#       all-linear would target dead weight for our text-only task)
#   - max_steps: 500 -> 200  (12B step-time ~1.7x; cost envelope $46-71 inside $80 cap)
#   - [ckpt] interval: 50 -> 25  (denser eval grid; tighter death-recovery)
#   - [orchestrator] batch_size: 32 -> 16  (12B memory pressure)
#   - [orchestrator] group_size: 16 -> 8   (12B + max-model-len 2560)
#   - seq_len: 5120 -> 4096
#   - max_completion_tokens: 2048 -> 1024  (align with eval; remove train-vs-eval footgun)
#   - LAUNCH inference at --gpu-memory-utilization 0.40 --max-model-len 2560
#     (Qwen 7B used 0.30/5120; Gemma 12B weights alone are 23.9 GB so 0.30
#      leaves zero KV headroom)

max_steps = 200
seq_len = 4096

[ckpt]
interval = 25
keep_last = 6

[model]
name = "google/gemma-4-12B-it"

[trainer.model]
impl = "auto"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
# target_modules: the 7-projection standard set. prime-rl applies these to all
# layers whose name matches; for Gemma 4 Unified the language_model sub-tree
# carries them and the vision/audio sub-trees do not, so the match naturally
# excludes multimodal projections. Verified at install time (install_v4.sh
# pre-flight) and re-verified by the first trainer step's grad histogram.
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.optim]
lr = 5e-6

[trainer.weight_broadcast]
type = "filesystem"

# v3 corpus reused: same ~1000-row dataset with frozen 37-row holdout.
# v4 is a model swap, not a data refresh, so the comparison is apples-to-apples
# vs v3 (controlling for data).
[trainer.dataset]
id = "vtemian/dockermin-v1"

# Per-process wandb offline blocks; mirrors v3 pattern. Top-level [wandb] is
# rejected by `rl`.
[trainer.wandb]
project = "dockermin"
name = "v4-gemma4-12b-it"
offline = true

[orchestrator]
batch_size = 16
group_size = 8

[orchestrator.wandb]
project = "dockermin"
name = "v4-gemma4-12b-it"
offline = true

[orchestrator.train.sampling]
max_completion_tokens = 1024

# Same v3 zero-advantage filter policy: track only, do not skip/reject. The
# manifest rung will fire less under Gemma (probe showed 0 hallucinated tags)
# but the policy still avoids the MAX_EMPTY_BATCH_ATTEMPTS crash mode.
[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[[orchestrator.train.env]]
id = "dockermin-env"
name = "dockermin-env"
args = {}

[inference] # defaults; max-model-len capped at launch to 2560 (see launch_v4.sh)

# Gemma 4-it is not in prime-rl MODEL_RENDERER_MAP; use the default renderer
# which calls tokenizer.apply_chat_template — Gemma's chat_template.jinja
# natively supports the system role (verified by the gemma_zs probe).
[orchestrator.renderer]
name = "default"
