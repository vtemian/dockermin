# configs/dockermin_pilot.toml — 50-step GRPO pilot (go/no-go gate)
#
# Schema mirrors prime-rl examples/alphabet_sort/rl.toml as captured live on the
# pod 2026-05-26 (pin 3f5ee35). The 2026-05-22 schema was stale — verified and
# rewritten after the Phase 1 smoke. Validate before spending GPU time with:
#
#   uv run --no-sync rl @ configs/dockermin_pilot.toml --dry-run
#
# LAUNCH incantation (NOT expressible in the toml — see docs/decisions/2026-05-22-prime-rl-pin.md):
#   - export VLLM_USE_DEEP_GEMM=0 VLLM_MOE_USE_DEEP_GEMM=0   (CUDA-13 deep_gemm wheel vs CUDA-12 stack)
#   - cap inference context for Qwen2.5-Coder-7B (32K default): --inference.model.max-model-len 8192
#   - DooD + egress proxy must be up first (scripts/setup_pod_docker.sh, setup_pod_proxy.sh)
#
# THROUGHPUT NOTE: unlike alphabet_sort, every rollout here is a real `docker build`
# + `docker run`. With group_size=8 × batch_size=8 = 64 builds/step, gated by
# DOCKERMIN_MAX_BUILDS (default 6) concurrent, build wall-time dominates step time.
# Tune batch_size / DOCKERMIN_MAX_BUILDS against observed step time on the pod.

max_steps = 50
seq_len = 4096

[ckpt]

[model]
name = "Qwen/Qwen2.5-Coder-7B-Instruct"

[wandb]
project = "dockermin"
name = "pilot-50step"

[trainer.model]
impl = "auto"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
lr = 5e-6

# NCCL weight broadcast does not support LoRA; filesystem broadcast is the
# colocation-safe path proven in the Phase 1 smoke.
[trainer.weight_broadcast]
type = "filesystem"

[orchestrator]
batch_size = 8
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.env]]
# verifiers maps id "dockermin-env" -> module "dockermin_env" -> load_environment().
id = "dockermin-env"
name = "dockermin-env"
args = {}

[inference] # defaults; max-model-len capped at launch (see header)
